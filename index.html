<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the app draw under the iPhone notch and home
         bar; the CSS then pads back out with env(safe-area-inset-*). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1210" />
    <meta name="description" content="Live and online poker results — cash games and tournaments." />

    <!-- iOS ignores most of the web manifest. These tags are what make "Add to
         Home Screen" produce a full-screen app with a real icon and name. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PokerStats" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="icon.svg" />

    <title>PokerStats</title>
  </head>
  <body>
    <div id="root"></div>

    <!-- Last-resort startup check. If React has not mounted after 8s (a script
         that failed to load, a syntax error in an old cached build), say so
         instead of leaving a blank dark screen with nothing to report. -->
    <script>
      setTimeout(function () {
        if (window.__pokerStarted) return
        var root = document.getElementById('root')
        if (root && root.childElementCount) return
        root.innerHTML =
          '<div style="padding:32px 20px;color:#e8efe9;font-family:system-ui">' +
          '<h1 style="font-size:20px;margin:0 0 8px">PokerStats did not start</h1>' +
          '<p style="color:#9fb3a8;margin:0">Close the app completely and open it again. ' +
          'Your sessions are stored on this phone and are not affected.</p></div>'
      }, 8000)
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
