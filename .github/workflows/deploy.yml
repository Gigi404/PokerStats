# Build and publish to GitHub Pages on every push to main, and every morning.
#
# The morning run exists for the Playground tab: it re-fetches Playground's
# schedule, promos and jackpots (scripts/fetch-playground.mjs) and redeploys,
# so the data is at most a day old. Nothing is committed — the data file only
# lives in the deployed site.
#
# The app is static (no backend), so this is the whole deployment: GitHub builds
# dist/ and serves it at https://gigi404.github.io/PokerStats/. The repo's
# Settings → Pages → Source must be set to "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # 10:00 UTC = 06:00 Montréal in summer, 05:00 in winter.
    - cron: '0 10 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # Only for the keep-alive step below.
  actions: write

# One deploy at a time; a newer push replaces a queued one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      # Never fails the deploy: a section Playground doesn't answer keeps its
      # copy from the live site, and the tab shows how old that copy is.
      - run: npm run fetch:playground
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # GitHub switches off scheduled workflows in a repo with no commits for 60
  # days. For an app that is finished and just being used, that would silently
  # stop the morning refresh. Re-enabling the workflow on every run resets the
  # clock without committing anything.
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/deploy.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
